name: Fetch GSC Data
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  fetch-gsc-data:
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/873926140086/locations/global/workloadIdentityPools/github-actions/providers/github-provider'
          service_account: 'gsc-deployer@riverr360.iam.gserviceaccount.com'
          token_format: 'access_token'
          access_token_scopes: 'https://www.googleapis.com/auth/webmasters.readonly'
      - name: List accessible sites
        run: |
          curl -X GET \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            "https://searchconsole.googleapis.com/webmasters/v3/sites"
